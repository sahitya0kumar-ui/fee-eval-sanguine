<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Banks — Sanguine</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Blood Banks</span>
      <h1>Partner blood banks near you</h1>
      <p class="lead">Contact details, hours, and current available groups.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container grid grid-2" id="bankList"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const mount = document.getElementById('bankList');
  const banks = DB.all(DB.KEYS.BANKS);
  mount.innerHTML = banks.map(b => `
    <div class="card bank-card reveal in">
      <div class="flex items-center justify-between">
        <h3 class="mb-0">${b.name}</h3>
        <span class="badge ${b.hours.includes('24/7') ? 'badge-success' : ''}">${b.hours}</span>
      </div>
      <p class="muted mb-0">📍 ${b.address}</p>
      <p class="muted mb-0">📞 <a href="tel:${b.phone}">${b.phone}</a></p>
      <div class="flex gap-sm" style="flex-wrap:wrap;margin-top:0.4rem;">
        ${b.groups.map(g => `<span class="badge">${g}</span>`).join('')}
      </div>
    </div>`).join('');
});
</script>
</body>
</html>
