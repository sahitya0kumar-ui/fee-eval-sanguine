<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Sanguine</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>

<main class="auth-shell">
  <div class="container" style="max-width:460px;">
    <form id="loginForm" class="form-card" novalidate>
      <div class="text-center" style="margin-bottom:1.5rem;">
        <span class="eyebrow">Welcome back</span>
        <h1 style="font-size:1.8rem;">Log in to Sanguine</h1>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="demo@sanguine.app" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="demo1234" required>
        <div class="hint"><a href="#" id="forgotLink">Forgot password?</a></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
      <p class="muted text-center" style="margin-top:1rem;">New here? <a href="signup.html" style="color:var(--color-primary);font-weight:600;">Create an account</a></p>
    </form>

    <form id="forgotForm" class="form-card mt-lg" novalidate style="display:none;">
      <h3>Reset your password</h3>
      <p class="muted">Enter your email and we'll simulate sending a reset link.</p>
      <div class="field">
        <label for="femail">Email</label>
        <input type="email" id="femail" name="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
});
</script>
</body>
</html>
