<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Sanguine</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>

<main id="dashRoot">
  <section class="page-hero">
    <div class="container dash-toolbar">
      <div><span class="eyebrow">Impact Dashboard</span><h1 class="mb-0">Network overview</h1></div>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="card mb-lg" id="donorSnapshot"></div>

      <div class="card mb-lg">
        <h3>Quick actions</h3>
        <div class="quick-actions">
          <a href="donors.html" class="btn btn-ghost btn-sm">🔍 Find a Donor</a>
          <a href="request.html" class="btn btn-ghost btn-sm">🚨 Post a Request</a>
          <a href="camps.html" class="btn btn-ghost btn-sm">📅 Register for a Camp</a>
          <a href="donor.html" class="btn btn-primary btn-sm">🩸 Update My Profile</a>
        </div>
      </div>

      <div class="dash-grid">
        <div class="card stat-card"><div class="num"><span id="statDonors">0</span></div><p class="mb-0">Total donors</p></div>
        <div class="card stat-card"><div class="num"><span id="statRequests">0</span></div><p class="mb-0">Blood requests</p></div>
        <div class="card stat-card"><div class="num"><span id="statBanks">0</span></div><p class="mb-0">Blood banks</p></div>
        <div class="card stat-card"><div class="num"><span id="statCamps">0</span></div><p class="mb-0">Upcoming camps</p></div>
      </div>

      <div class="grid grid-2 mt-lg">
        <div class="card chart-card">
          <h3>Donors by blood group</h3>
          <div class="bar-chart" id="groupBarChart"></div>
          <div class="bar-labels" id="groupBarLabels"></div>
        </div>
        <div class="card chart-card">
          <h3>Blood units available</h3>
          <div class="donut-wrap" style="width:180px;height:180px;margin-inline:auto;">
            <svg width="180" height="180" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--color-line)" stroke-width="3"></circle>
              <circle cx="18" cy="18" r="15.5" fill="none" stroke="url(#dashGrad)" stroke-width="3" stroke-dasharray="70,100" stroke-linecap="round" transform="rotate(-90 18 18)"></circle>
              <defs><linearGradient id="dashGrad"><stop offset="0%" stop-color="#D90429"/><stop offset="100%" stop-color="#8B0015"/></linearGradient></defs>
            </svg>
            <div class="center-label"><b><span id="statUnits">0</span></b><span class="muted">units</span></div>
          </div>
        </div>
      </div>

      <div class="grid grid-2 mt-lg">
        <div class="card">
          <h3>Recent requests</h3>
          <div id="recentRequestsTable"></div>
        </div>
        <div class="card">
          <h3>Upcoming camps</h3>
          <div id="dashCamps" class="grid" style="gap:0.8rem;"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
